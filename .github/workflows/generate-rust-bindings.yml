name: Generate Rust bindings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install LLVM (includes libclang)
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install bindgen CLI
        shell: pwsh
        run: cargo install bindgen-cli --locked

      - name: Verify header exists
        shell: pwsh
        run: |
          if (-not (Test-Path "src/XGameInput/XGameInput.h")) {
            throw "Header not found: src/XGameInput/XGameInput.h"
          }

      - name: Generate Rust bindings
        shell: pwsh
        run: |
          bindgen src/XGameInput/XGameInput.h `
            --output bindings.rs `
            --allowlist-function "XGameInput.*" `
            --allowlist-type "XGAMEINPUT_.*" `
            --allowlist-var "XGAMEINPUT_.*"

      - name: Upload generated bindings
        uses: actions/upload-artifact@v4
        with:
          name: xgameinput-rust-bindings
          path: bindings.rs
          if-no-files-found: error
