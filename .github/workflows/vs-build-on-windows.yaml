name: Build release on Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64, x86]
    steps:
      - uses: actions/checkout@v6
      
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: "18.0"   # VS 2026
          msbuild-architecture: x64
       
      - name: Build SDL3
        run: msbuild ".\vendor\SDL3\VisualC\SDL.sln" /t:SDL3:Rebuild /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform == 'x86' && 'Win32' || matrix.platform }}
         
      - name: Build solution
        run: msbuild ".\vc\XGameInput.sln" /t:"XGameInput:Rebuild" /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
        
      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            build/**/output/**/*.dll
            build/**/output/**/*.lib
          compression-level: 0
        
  package:
    runs-on: windows-2025-vs2026
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: build

      - name: Install 7-Zip
        run: choco install 7zip -y

      - name: Create 7z Archive
        id: create-archive
        shell: powershell
        run: |
          $name = "${{ github.repository }}" -split '/' | Select-Object -Last 1
          $archivePath = ".\build\$name.7z"

          $tmp = ".\build\release"
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp | Out-Null
        
          New-Item -ItemType Directory -Path "$tmp\XGameInput" | Out-Null
          New-Item -ItemType Directory -Path "$tmp\XGameInput\x64" | Out-Null
          New-Item -ItemType Directory -Path "$tmp\XGameInput\x86" | Out-Null

          Copy-Item ".\build\XGameInput\output\x64\Release\XGameInput.dll" "$tmp\XGameInput\x64\XGameInput.dll" -Force
          Copy-Item ".\build\XGameInput\output\x64\Release\XGameInput.lib" "$tmp\XGameInput\x64\XGameInput.lib" -Force
          Copy-Item ".\src\XGameInput\XGameInput.h" "$tmp\XGameInput\x64\XGameInput.h" -Force
          
          Copy-Item ".\build\XGameInput\output\Win32\Release\XGameInput.dll" "$tmp\XGameInput\x86\XGameInput.dll" -Force
          Copy-Item ".\build\XGameInput\output\Win32\Release\XGameInput.lib" "$tmp\XGameInput\x86\XGameInput.lib" -Force
          Copy-Item ".\src\XGameInput\XGameInput.h" "$tmp\XGameInput\x86\XGameInput.h" -Force

          # Misc
          Copy-Item ".\README.md" $tmp -Force
          Copy-Item ".\LICENSE" $tmp -Force

          & "C:\Program Files\7-Zip\7z.exe" a $archivePath "$tmp\*"

          Remove-Item $tmp -Recurse -Force

          Write-Output "filepath=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Upload release
        uses: actions/upload-artifact@v6
        with:
          name: release
          path: ${{ steps.create-archive.outputs.filepath }}
          compression-level: 0